name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel
        type: choice
        options:
          - latest
          - stable
        default: latest
      version:
        description: Explicit version (required for stable; latest defaults to 0.0.0-latest.<UTC timestamp>)
        required: false
        type: string

permissions:
  contents: write

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - id: v
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_CHANNEL: ${{ inputs.channel }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            channel="$INPUT_CHANNEL"
            version="$INPUT_VERSION"
            if [ -z "$version" ]; then
              if [ "$channel" != latest ]; then
                echo "::error::the version input is required for a stable release" >&2
                exit 1
              fi
              version="0.0.0-latest.$(date -u +%Y%m%d.%H%M)"
            fi
            if [[ "$version" == *$'\n'* || "$version" == *$'\r'* ]]; then
              echo "::error::version must be a single line" >&2
              exit 1
            fi
            case "$channel" in
              latest)
                [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-latest\.[0-9]{8}\.[0-9]{4}$ ]] \
                  || { echo "::error::latest versions must be X.Y.Z-latest.YYYYMMDD.HHMM (no leading zeros in X.Y.Z)" >&2; exit 1; }
                ;;
              stable)
                [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] \
                  || { echo "::error::stable versions must be X.Y.Z (no leading zeros)" >&2; exit 1; }
                ;;
              *)
                echo "::error::invalid channel" >&2
                exit 1
                ;;
            esac
            tag="v${version}"
            if gh api "repos/${GITHUB_REPOSITORY}/git/refs/tags/${tag}" >/dev/null 2>&1; then
              echo "::error::tag $tag already exists" >&2
              exit 1
            fi
          else
            version="${GITHUB_REF_NAME#v}"
            if [[ "$version" == *$'\n'* || "$version" == *$'\r'* ]]; then
              echo "::error::tag must be a single line" >&2
              exit 1
            fi
            [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-latest\.[0-9]{8}\.[0-9]{4})?$ ]] \
              || { echo "::error::tag must be vX.Y.Z or vX.Y.Z-latest.YYYYMMDD.HHMM (no leading zeros in X.Y.Z)" >&2; exit 1; }
            tag="v${version}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  web:
    name: Build web UI
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile --ignore-scripts

      - run: pnpm --filter @blob-1/web build

      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
          retention-days: 1

  build:
    name: Build ${{ matrix.platform }}
    needs: [version, web]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            platform: linux-x64
            os: ubuntu-24.04
          - target: aarch64-apple-darwin
            platform: darwin-arm64
            os: macos-15
    env:
      BLOB_1_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }} -p agent

      - name: Package binary
        run: |
          archive="blob-1-${BLOB_1_VERSION}-${{ matrix.platform }}.tar.gz"
          stage="$(mktemp -d)"
          cp "target/${{ matrix.target }}/release/agent" "${stage}/blob-1"
          tar -C "${stage}" -czf "${archive}" blob-1
          rm -rf "${stage}"

      # The CEF browser companion ships as its own archive (Linux only for
      # now); `blob-1 update --browser` unpacks it into `browser/`.
      - name: Build browser companion
        if: matrix.platform == 'linux-x64'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build
          export CEF_PATH="${RUNNER_TEMP}/cef"
          crates/browser/scripts/dist.sh --release "${RUNNER_TEMP}/browser-dist"
          tar -C "${RUNNER_TEMP}/browser-dist" -czf "blob-1-browser-${BLOB_1_VERSION}-${{ matrix.platform }}.tar.gz" .

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: blob-1-*.tar.gz
          retention-days: 1

  release:
    name: Publish GitHub Release
    needs: [version, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist

      - name: Generate checksums
        working-directory: dist
        run: sha256sum blob-1-*.tar.gz > SHA256SUMS

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          EVENT_NAME: ${{ github.event_name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          case "$TAG" in
            v*-latest.*) flags=(--prerelease --latest=false) ;;
            *) flags=(--latest) ;;
          esac
          target=()
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            target=(--target "$COMMIT_SHA")
          fi
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --generate-notes "${flags[@]}" "${target[@]}"
