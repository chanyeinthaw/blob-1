[package]
name = "mcp"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
async-trait.workspace = true
base64.workspace = true
environment.workspace = true
libc = "0.2"
process-wrap = { version = "10.0", features = ["tokio1", "process-group"] }
reqwest = { version = "0.13.2", default-features = false, features = ["json", "stream", "rustls"] }
rmcp = { version = "3.11.0", default-features = false, features = ["client", "auth", "transport-child-process", "transport-streamable-http-client-reqwest", "reqwest"] }
serde.workspace = true
serde_json.workspace = true
storage.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["net", "process"] }
url = "2"
