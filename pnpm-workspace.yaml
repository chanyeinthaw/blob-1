packages:
  - apps/*
  - packages/*

catalog:
  '@base-ui/react': 1.9.0
  '@effect/atom-react': 4.1.0
  '@effect/tsgo': 0.73.2
  '@fontsource-variable/inter': 5.3.0
  '@fontsource-variable/jetbrains-mono': 5.3.0
  '@oxlint/plugins': 1.94.0
  '@tailwindcss/vite': 4.3.5
  '@tanstack/react-router': 1.170.46
  '@tanstack/router-plugin': 1.169.0
  '@typeonce/effect-machine': 0.46.0
  '@typeonce/effect-machine-react': 0.46.0
  '@types/node': 24.12.4
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  '@vitejs/plugin-react': 6.3.0
  class-variance-authority: 0.7.1
  clsx: 2.1.1
  effect: 4.1.0
  lucide-react: 1.77.0
  react: 19.3.1
  react-dom: 19.3.1
  sonner: 2.0.8
  tailwind-merge: 3.7.1
  tailwindcss: 4.3.5
  tw-animate-css: 1.4.0
  vite: npm:@voidzero-dev/vite-plus-core@8.3.8000
  vite-plus: 1.7.0

overrides:
  vite: 'catalog:'
  vite-plus: 'catalog:'
  effect: 'catalog:'

allowBuilds:
  esbuild: true
  '@tailwindcss/oxide': true

# effect-machine-react 0.46.0 does not import scheduler; its stale peer range
# predates react-dom 19.3, which resolves scheduler 0.28.0.
peerDependencyRules:
  allowedVersions:
    '@typeonce/effect-machine-react>scheduler': '0.28.0'
  allowAny:
    - vite
