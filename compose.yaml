services:
  agent:
    build: .
    command: ["serve", "--web", "127.0.0.1:7878", "--public-url", "https://silicon.tailcd7ccb.ts.net:7878"]
    network_mode: host
    restart: unless-stopped
    environment:
      CPA1_KEY: ${CPA1_KEY:?}
      BLOB_1_APP_KEY: ${BLOB_1_APP_KEY:?}
    volumes:
      - agent-data:/data

volumes:
  agent-data:
