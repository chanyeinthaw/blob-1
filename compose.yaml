services:
  agent:
    build: .
    command: ["serve", "--web", "127.0.0.1:7878", "--public-url", "https://silicon.tailcd7ccb.ts.net:7878"]
    network_mode: host
    restart: unless-stopped
    environment:
      CPA1_KEY: ${CPA1_KEY:?}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:?}
    volumes:
      - agent-data:/data

volumes:
  agent-data:
