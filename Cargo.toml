[workspace]
resolver = "2"
members = [
  "crates/agent",
  "crates/harness",
  "crates/llm-rig",
  "crates/storage",
  "crates/storage-sqlite",
  "crates/vfs",
  "crates/environment",
  "crates/environment-local",
]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
environment = { path = "crates/environment" }
rusqlite = { version = "0.43", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
harness = { path = "crates/harness" }
environment-local = { path = "crates/environment-local" }
llm-rig = { path = "crates/llm-rig" }
storage-sqlite = { path = "crates/storage-sqlite" }
vfs = { path = "crates/vfs" }
rig-core = "0.46"
fuser = "0.18"
storage = { path = "crates/storage" }
thiserror = "1"
tokio = { version = "1", features = ["process", "fs", "io-util", "rt", "time", "sync", "macros"] }
