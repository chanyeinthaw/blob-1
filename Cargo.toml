[workspace]
resolver = "2"
members = [
  "crates/agent",
  "crates/harness",
  "crates/llm",
  "crates/memory",
  "crates/llm-rig",
  "crates/storage",
  "crates/storage-sqlite",
  "crates/environment",
  "crates/environment-local",
  "crates/interface",
  "crates/interface-discord",
]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
environment = { path = "crates/environment" }
rusqlite = { version = "0.43", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
harness = { path = "crates/harness" }
interface = { path = "crates/interface" }
interface-discord = { path = "crates/interface-discord" }
environment-local = { path = "crates/environment-local" }
llm = { path = "crates/llm" }
memory = { path = "crates/memory" }
llm-rig = { path = "crates/llm-rig" }
storage-sqlite = { path = "crates/storage-sqlite" }
rig-core = "0.46"
storage = { path = "crates/storage" }
thiserror = "1"
twilight-gateway = "0.18"
twilight-http = "0.18"
twilight-model = "0.18"
tokio = { version = "1", features = ["process", "fs", "io-util", "rt", "time", "sync", "macros"] }
